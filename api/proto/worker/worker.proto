syntax = "proto3";

package worker;

option go_package = "gotaskai/api/proto/worker";

service WorkerService {
  // CancelTask 强制终止正在处理的任务
  rpc CancelTask (CancelRequest) returns (CancelResponse);
}

message CancelRequest {
  string task_id = 1;
}

message CancelResponse {
  bool success = 1;
  string message = 2;
}
