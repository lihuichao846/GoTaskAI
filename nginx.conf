# 工作进程数，通常设置为电脑的 CPU 核心数，Docker 容器内默认 1 即可
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 1. 定义 GoTaskAI 后端实例集群 
    # 在 Docker 中，host.docker.internal 指代宿主机 (即你运行 Go 代码的机器)
    upstream gotaskai_backend {
        server host.docker.internal:8080;
    }

    # 2. 定义 Web 服务器
    server {
        listen       80;
        server_name  localhost;

        # 【核心1：动静分离】前端静态页面直接由 Nginx 读取
        location / {
            # 在 Docker 容器内部，我们将宿主机的 public 文件夹映射到了这个路径
            root /usr/share/nginx/html;
            index index.html;
            
            # 单页应用必备：如果找不到文件，就返回 index.html
            try_files $uri $uri/ /index.html;
        }

        # 【核心2：反向代理】所有 /api 开头的请求，转发给 Go 后端
        location /api/ {
            proxy_pass http://gotaskai_backend;
            
            # 传递真实的客户端 IP 和 Host 给 Go 程序 (防止限流误杀)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 【核心3：支持 SSE 长连接】针对打字机效果，必须关闭 Nginx 缓冲
        location /api/tasks/stream {
            proxy_pass http://gotaskai_backend/api/tasks/stream;
            
            # 关掉 Nginx 缓存，让数据能实时流向浏览器
            proxy_buffering off;
            proxy_cache off;
            
            # 保持长连接不被切断
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            
            proxy_set_header Host $host;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
        }
        
        # 挂载 Asynq 监控面板
        location /admin/tasks/ {
            proxy_pass http://gotaskai_backend/admin/tasks/;
            proxy_set_header Host $host;
        }
    }
}
