version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gotaskai_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gotaskai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis/redis-stack-server:latest
    container_name: gotaskai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  neo4j:
    image: neo4j:5.18.1
    container_name: gotaskai_neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  nginx:
    image: nginx:latest
    container_name: gotaskai_nginx
    ports:
      - "80:80"
    volumes:
      # 将刚才创建的 nginx.conf 映射到容器内部覆盖默认配置
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # 将本项目的 public 文件夹(前端静态页面) 映射到 Nginx 容器的默认网页目录下
      - ./public:/usr/share/nginx/html:ro
    # 允许容器通过 host.docker.internal 访问宿主机上跑着的 Go 进程 (8080端口)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
      - redis
      - neo4j

volumes:
  mysql_data:
  redis_data:
  neo4j_data: