services:
  mysql:
    image: mysql:8.0
    container_name: gotaskai_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gotaskai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.2

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis/redis-stack-server:latest
    container_name: gotaskai_redis
    command: ["redis-server", "--port", "6379", "--bind", "0.0.0.0", "--protected-mode", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.10

  redis_replica_1:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis/redis-stack-server:latest
    container_name: gotaskai_redis_replica_1
    command: ["redis-server", "--port", "6379", "--bind", "0.0.0.0", "--protected-mode", "no", "--replicaof", "172.28.0.10", "6379"]
    depends_on:
      - redis
    volumes:
      - redis_replica_1_data:/data
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.11

  redis_replica_2:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis/redis-stack-server:latest
    container_name: gotaskai_redis_replica_2
    command: ["redis-server", "--port", "6379", "--bind", "0.0.0.0", "--protected-mode", "no", "--replicaof", "172.28.0.10", "6379"]
    depends_on:
      - redis
    volumes:
      - redis_replica_2_data:/data
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.12

  redis_sentinel_1:
    image: redis:7.2-alpine
    container_name: gotaskai_redis_sentinel_1
    command: ["sh", "-c", "cp /seed/sentinel.conf /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"]
    depends_on:
      - redis
      - redis_replica_1
      - redis_replica_2
    ports:
      - "26379:26379"
    volumes:
      - ./docker/redis/sentinel-1.conf:/seed/sentinel.conf:ro
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.21

  redis_sentinel_2:
    image: redis:7.2-alpine
    container_name: gotaskai_redis_sentinel_2
    command: ["sh", "-c", "cp /seed/sentinel.conf /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"]
    depends_on:
      - redis
      - redis_replica_1
      - redis_replica_2
    ports:
      - "26380:26379"
    volumes:
      - ./docker/redis/sentinel-2.conf:/seed/sentinel.conf:ro
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.22

  redis_sentinel_3:
    image: redis:7.2-alpine
    container_name: gotaskai_redis_sentinel_3
    command: ["sh", "-c", "cp /seed/sentinel.conf /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"]
    depends_on:
      - redis
      - redis_replica_1
      - redis_replica_2
    ports:
      - "26381:26379"
    volumes:
      - ./docker/redis/sentinel-3.conf:/seed/sentinel.conf:ro
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.23

  neo4j:
    image: neo4j:5.18.1
    container_name: gotaskai_neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.30

  api:
    image: golang:1.25
    container_name: gotaskai_api
    working_dir: /app
    command: ["sh", "-c", "go run ./cmd/api"]
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - ./config/config.docker.yaml:/app/config/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
      - redis
      - redis_replica_1
      - redis_replica_2
      - redis_sentinel_1
      - redis_sentinel_2
      - redis_sentinel_3
      - neo4j
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.31

  worker:
    image: golang:1.25
    container_name: gotaskai_worker
    working_dir: /app
    command: ["sh", "-c", "go run ./cmd/worker"]
    ports:
      - "50051:50051"
    volumes:
      - ./:/app
      - ./config/config.docker.yaml:/app/config/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
      - redis
      - redis_replica_1
      - redis_replica_2
      - redis_sentinel_1
      - redis_sentinel_2
      - redis_sentinel_3
      - neo4j
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.32

  nginx:
    image: nginx:latest
    container_name: gotaskai_nginx
    ports:
      - "80:80"
    volumes:
      # 将刚才创建的 nginx.conf 映射到容器内部覆盖默认配置
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # 将本项目的 public 文件夹(前端静态页面) 映射到 Nginx 容器的默认网页目录下
      - ./public:/usr/share/nginx/html:ro
    # 允许容器通过 host.docker.internal 访问宿主机上跑着的 Go 进程 (8080端口)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - mysql
      - redis
      - redis_sentinel_1
      - redis_sentinel_2
      - redis_sentinel_3
      - neo4j
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.40

volumes:
  mysql_data:
  redis_master_data:
  redis_replica_1_data:
  redis_replica_2_data:
  neo4j_data:

networks:
  gotaskai_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
