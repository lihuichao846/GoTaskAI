services:
  mysql:
    image: mysql:8.0
    container_name: gotaskai_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gotaskai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.2

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis/redis-stack-server:latest
    container_name: gotaskai_redis
    command: ["redis-server", "--port", "6379", "--bind", "0.0.0.0", "--protected-mode", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.10

  redis_replica_1:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis/redis-stack-server:latest
    container_name: gotaskai_redis_replica_1
    command: ["redis-server", "--port", "6379", "--bind", "0.0.0.0", "--protected-mode", "no", "--replicaof", "172.28.0.10", "6379"]
    depends_on:
      - redis
    volumes:
      - redis_replica_1_data:/data
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.11

  redis_replica_2:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis/redis-stack-server:latest
    container_name: gotaskai_redis_replica_2
    command: ["redis-server", "--port", "6379", "--bind", "0.0.0.0", "--protected-mode", "no", "--replicaof", "172.28.0.10", "6379"]
    depends_on:
      - redis
    volumes:
      - redis_replica_2_data:/data
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.12

  redis_sentinel_1:
    image: redis:7.2-alpine
    container_name: gotaskai_redis_sentinel_1
    command: ["sh", "-c", "cp /seed/sentinel.conf /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"]
    depends_on:
      - redis
      - redis_replica_1
      - redis_replica_2
    ports:
      - "26379:26379"
    volumes:
      - ./docker/redis/sentinel-1.conf:/seed/sentinel.conf:ro
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.21

  redis_sentinel_2:
    image: redis:7.2-alpine
    container_name: gotaskai_redis_sentinel_2
    command: ["sh", "-c", "cp /seed/sentinel.conf /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"]
    depends_on:
      - redis
      - redis_replica_1
      - redis_replica_2
    ports:
      - "26380:26379"
    volumes:
      - ./docker/redis/sentinel-2.conf:/seed/sentinel.conf:ro
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.22

  redis_sentinel_3:
    image: redis:7.2-alpine
    container_name: gotaskai_redis_sentinel_3
    command: ["sh", "-c", "cp /seed/sentinel.conf /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"]
    depends_on:
      - redis
      - redis_replica_1
      - redis_replica_2
    ports:
      - "26381:26379"
    volumes:
      - ./docker/redis/sentinel-3.conf:/seed/sentinel.conf:ro
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.23

  neo4j:
    image: neo4j:5.18.1
    container_name: gotaskai_neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.30

  etcd:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/coreos/etcd:v3.5.5
    container_name: gotaskai_etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.50

  minio:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: gotaskai_minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.51

  milvus:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/milvusdb/milvus:v2.4.4
    container_name: gotaskai_milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.52

  nginx:
    image: nginx:latest
    container_name: gotaskai_nginx
    ports:
      - "80:80"
    volumes:
      # 将刚才创建的 nginx.conf 映射到容器内部覆盖默认配置
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # 将本项目的 public 文件夹(前端静态页面) 映射到 Nginx 容器的默认网页目录下
      - ./public:/usr/share/nginx/html:ro
    # 允许容器通过 host.docker.internal 访问宿主机上跑着的 Go 进程 (8080端口)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
      - redis
      - redis_sentinel_1
      - redis_sentinel_2
      - redis_sentinel_3
      - neo4j
    networks:
      gotaskai_net:
        ipv4_address: 172.28.0.40

volumes:
  mysql_data:
  redis_master_data:
  redis_replica_1_data:
  redis_replica_2_data:
  neo4j_data:
  etcd_data:
  minio_data:
  milvus_data:

networks:
  gotaskai_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
